<!-- Sucio Records drain band: Cali street grate with plants. Shared by site and print. See DESIGN.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 210" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- one sprout: stem + leaves, reused across the drain -->
    <symbol id="sprout" viewBox="0 0 60 120">
      <path d="M30 120 C30 90 28 70 32 40" stroke="#3f5a2c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M31 78 C14 70 6 56 8 44 C22 48 30 60 31 78Z" fill="#6f8f4e"/>
      <path d="M31 62 C46 56 54 42 52 30 C38 34 31 46 31 62Z" fill="#8fb26a"/>
      <path d="M32 42 C24 32 24 18 32 6 C40 18 40 32 32 42Z" fill="#6f8f4e"/>
      <path d="M31 96 C46 92 56 80 56 70 C42 72 33 82 31 96Z" fill="#3f5a2c"/>
    </symbol>
    <symbol id="fern" viewBox="0 0 80 140">
      <path d="M40 140 C42 100 30 60 10 20" stroke="#3f5a2c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <g fill="#8fb26a">
        <ellipse cx="34" cy="110" rx="12" ry="4" transform="rotate(-20 34 110)"/>
        <ellipse cx="48" cy="104" rx="12" ry="4" transform="rotate(25 48 104)"/>
        <ellipse cx="29" cy="90" rx="11" ry="4" transform="rotate(-25 29 90)"/>
        <ellipse cx="42" cy="84" rx="11" ry="4" transform="rotate(20 42 84)"/>
        <ellipse cx="23" cy="70" rx="10" ry="3.5" transform="rotate(-30 23 70)"/>
        <ellipse cx="35" cy="64" rx="10" ry="3.5" transform="rotate(15 35 64)"/>
        <ellipse cx="17" cy="50" rx="9" ry="3" transform="rotate(-35 17 50)"/>
        <ellipse cx="27" cy="44" rx="9" ry="3" transform="rotate(10 27 44)"/>
        <ellipse cx="13" cy="32" rx="7" ry="2.6" transform="rotate(-40 13 32)"/>
      </g>
    </symbol>
  </defs>
      <rect x="0" y="150" width="1400" height="60" fill="#0f2a3a"/>
      <!-- curb -->
      <rect x="0" y="140" width="1400" height="14" fill="#9c9a90"/>
      <rect x="0" y="140" width="1400" height="3" fill="#bdbab0"/>
      <!-- grate -->
      <g transform="translate(470 126)">
        <rect x="0" y="0" width="460" height="70" rx="6" fill="#1d4660" stroke="#161614" stroke-width="3"/>
        <g fill="#0b1d28">
          <rect x="22" y="12" width="16" height="46" rx="3"/><rect x="54" y="12" width="16" height="46" rx="3"/>
          <rect x="86" y="12" width="16" height="46" rx="3"/><rect x="118" y="12" width="16" height="46" rx="3"/>
          <rect x="150" y="12" width="16" height="46" rx="3"/><rect x="182" y="12" width="16" height="46" rx="3"/>
          <rect x="214" y="12" width="16" height="46" rx="3"/><rect x="246" y="12" width="16" height="46" rx="3"/>
          <rect x="278" y="12" width="16" height="46" rx="3"/><rect x="310" y="12" width="16" height="46" rx="3"/>
          <rect x="342" y="12" width="16" height="46" rx="3"/><rect x="374" y="12" width="16" height="46" rx="3"/>
          <rect x="406" y="12" width="16" height="46" rx="3"/>
        </g>
        <text x="230" y="66" text-anchor="middle" font-family="Space Mono, monospace" font-size="9" fill="#2c6283" letter-spacing="3">EMCALI · ALCANTARILLADO</text>
      </g>
      <!-- plants pushing out of the slots and the curb cracks -->
      <use href="#fern"   x="476" y="20"  width="70"  height="130"/>
      <use href="#sprout" x="540" y="56"  width="50"  height="100"/>
      <use href="#fern"   x="600" y="0"   width="86"  height="150" transform="scale(-1 1) translate(-1286 0)"/>
      <use href="#sprout" x="690" y="40"  width="60"  height="116"/>
      <use href="#fern"   x="752" y="10"  width="80"  height="140"/>
      <use href="#sprout" x="830" y="64"  width="44"  height="88"/>
      <use href="#sprout" x="880" y="34"  width="56"  height="112" transform="scale(-1 1) translate(-1816 0)"/>
      <use href="#sprout" x="120" y="84"  width="36"  height="70"/>
      <use href="#fern"   x="1180" y="60" width="50"  height="92"/>
      <use href="#sprout" x="1240" y="90" width="30"  height="58"/>
      <!-- puddle shine -->
      <ellipse cx="300" cy="182" rx="120" ry="6" fill="#2c6283" opacity=".6"/>
      <ellipse cx="1080" cy="190" rx="160" ry="5" fill="#2c6283" opacity=".5"/>
    </svg>
